<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - arXiv Assistant</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">📚 arXiv Assistant</a>
            <div class="nav-links">
                <a href="/">Библиотека</a>
                <a href="/search">Поиск</a>
                <a href="/authors">Авторы</a>
                <a href="/stats">Статистика</a>
                <a href="/export/bibtex" download>Экспорт BibTeX</a>
            </div>
        </div>
    </nav>
    
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        <div class="container">
            <p>arXiv CLI Web UI • Powered by FastAPI & HTMX</p>
        </div>
    </footer>
</body>
</html>
